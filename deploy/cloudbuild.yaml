# Builds both images on Cloud Build (no local Docker needed) and pushes them to
# Artifact Registry. Run from the repository root through deploy/deploy.sh.
substitutions:
  _REGISTRY: ""      # <region>-docker.pkg.dev/<project>/supersede
  _TAG: v1
  _MODEL: edtorre/qwen3.5-hermes

steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.api", "-t", "${_REGISTRY}/supersede-api:${_TAG}", "."]
    waitFor: ["-"]
  - id: llm
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.llm", "--build-arg", "MODEL=${_MODEL}",
           "-t", "${_REGISTRY}/supersede-llm:${_TAG}", "."]
    waitFor: ["-"]

images:
  - ${_REGISTRY}/supersede-api:${_TAG}
  - ${_REGISTRY}/supersede-llm:${_TAG}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
