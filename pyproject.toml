[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supersede"
version = "0.2.0"
description = "Benchmark and tooling for RAG over knowledge bases where documents get superseded, contradict each other, or are fabricated."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]
dense = ["sentence-transformers>=3", "numpy>=1.26"]
agent = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langchain-ollama>=1.0",
    "langchain-mistralai>=1.0",
    # langchain-mcp-adapters 0.3 targets the MCP SDK v1 (FastMCP).
    "mcp>=1.10,<2",
]
hub = ["huggingface_hub>=0.25", "datasets>=3"]
paper = ["matplotlib>=3.8"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
